apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "automaton.fullname" . }}
  labels:
    {{- include "automaton.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.deployment.replicas }}
  strategy:
    {{- toYaml .Values.deployment.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "automaton.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "automaton.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.healthCheck.enabled }}
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "node -e \"require('http').get('http://localhost:3000/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""
            initialDelaySeconds: {{ .Values.healthCheck.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthCheck.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.healthCheck.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.healthCheck.livenessProbe.failureThreshold }}
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "node -e \"require('http').get('http://localhost:3000/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""
            initialDelaySeconds: {{ .Values.healthCheck.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthCheck.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.healthCheck.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.healthCheck.readinessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            {{- if .Values.env.enabled }}
            {{- $configMapName := printf "%s-config" .Release.Name }}
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: {{ $configMapName | quote }}
                  key: NODE_ENV
            - name: AUTOMATON_SKIP_SETUP
              valueFrom:
                configMapKeyRef:
                  name: {{ $configMapName | quote }}
                  key: AUTOMATON_SKIP_SETUP
            - name: AUTOMATON_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ $configMapName | quote }}
                  key: AUTOMATON_NAME
            - name: AUTOMATON_GENESIS_PROMPT
              valueFrom:
                configMapKeyRef:
                  name: {{ $configMapName | quote }}
                  key: AUTOMATON_GENESIS_PROMPT
            - name: AUTOMATON_CREATOR_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: {{ $configMapName | quote }}
                  key: AUTOMATON_CREATOR_ADDRESS
            - name: CONWAY_API_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ $configMapName | quote }}
                  key: CONWAY_API_URL
            - name: NODE_OPTIONS
              valueFrom:
                configMapKeyRef:
                  name: {{ $configMapName | quote }}
                  key: NODE_OPTIONS
            - name: CONWAY_API_KEY
              valueFrom:
                configMapKeyRef:
                  name: {{ $configMapName | quote }}
                  key: CONWAY_API_KEY
            {{- else }}
            # 默认环境变量（当 env.enabled 为 false 时使用）
            - name: NODE_ENV
              value: production
            - name: AUTOMATON_SKIP_SETUP
              value: "true"
            - name: AUTOMATON_NAME
              value: "{{ .Release.Name }}"
            - name: AUTOMATON_GENESIS_PROMPT
              value: "You are a helpful AI assistant. Your goal is to help humans and other agents."
            - name: AUTOMATON_CREATOR_ADDRESS
              value: "0x0000000000000000000000000000000000000000"
            - name: CONWAY_API_URL
              value: "https://api.conway.tech"
            - name: NODE_OPTIONS
              value: "--max-old-space-size=2048"
            {{- end }}
          volumeMounts:
            - name: automaton-data
              mountPath: /app/data
            - name: automaton-config
              mountPath: /app/config
      volumes:
        - name: automaton-data
          {{- if .Values.persistence.enabled }}
          {{- if .Values.persistence.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "automaton.fullname" . }}-data
          {{- end }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: automaton-config
          emptyDir: {}
      restartPolicy: {{ .Values.deployment.restartPolicy }}
