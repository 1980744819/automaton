apiVersion: v1
kind: Service
metadata:
  name: {{ include "automaton.fullname" . }}
  labels:
    {{- include "automaton.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  {{- if .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.service.loadBalancerIP }}
  {{- end }}
  {{- if eq .Values.service.type "NodePort" }}
  {{- if .Values.service.nodePort }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 3000
      protocol: TCP
      name: http
      nodePort: {{ .Values.service.nodePort }}
  {{- else }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 3000
      protocol: TCP
      name: http
  {{- end }}
  {{- else }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 3000
      protocol: TCP
      name: http
  {{- end }}
  selector:
    {{- include "automaton.selectorLabels" . | nindent 4 }}
