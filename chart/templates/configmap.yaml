{{- if .Values.env.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    {{- include "automaton.labels" . | nindent 4 }}
data:
  NODE_ENV: "production"
  AUTOMATON_SKIP_SETUP: "true"
  AUTOMATON_NAME: {{ .Release.Name | quote }}
  AUTOMATON_GENESIS_PROMPT: "You are a helpful AI assistant."
  AUTOMATON_CREATOR_ADDRESS: "0x0000000000000000000000000000000000000000"
  CONWAY_API_URL: "https://api.conway.tech"
  CONWAY_API_KEY: ""
  NODE_OPTIONS: "--max-old-space-size=2048"
{{- end }}
